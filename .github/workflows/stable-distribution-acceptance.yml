name: Stable distribution acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-macos-install:
    name: Clean macOS install from published artifacts
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Record clean runner facts
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          node --version
          which node
          npm --version

      - name: Install exact stable packages without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/zamery-stable"
          cd "$RUNNER_TEMP/zamery-stable"
          npm init -y
          npm install --save-exact \
            @zamery/browser-provider@0.2.3 \
            @zamery/browser-firefox@0.2.2 \
            @zamery/browser-mcp@0.1.1 \
            @zamery/pi-browser@0.2.2
          npm ls @zamery/browser-provider @zamery/browser-firefox @zamery/browser-mcp @zamery/pi-browser
          test -f node_modules/@zamery/browser-mcp/codex/AGENTS.snippet.md
          node --input-type=module <<'NODE'
          await import("@zamery/browser-provider");
          await import("@zamery/browser-firefox");
          await import("@zamery/browser-mcp");
          await import("@zamery/pi-browser");
          NODE

      - name: Verify signed companion artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/zamery-stable"
          curl -fsSL \
            https://addons.mozilla.org/firefox/downloads/file/5091270/f82d5bdb37964220aafe-0.2.5.xpi \
            -o zamery-browser-companion-0.2.5.xpi
          observed="$(shasum -a 256 zamery-browser-companion-0.2.5.xpi | awk '{print $1}')"
          expected="8e89599e36fcec8d13c6da9d31cccf871626ce8b80d83e4345cd110eb8f8f59c"
          test "$observed" = "$expected"
          unzip -l zamery-browser-companion-0.2.5.xpi | grep -E 'META-INF/mozilla\.rsa|manifest\.json'

      - name: Verify native-host setup and doctor
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/zamery-stable"
          npx zamery-browser-firefox setup --dry-run
          npx zamery-browser-firefox setup
          npx zamery-browser-firefox doctor --json > doctor.json
          cat doctor.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("doctor.json", "utf8"));
          if (!report.ok) throw new Error("doctor reported a blocking problem");
          for (const id of ["node", "host-manifest", "host-launcher", "host-copy"]) {
            const finding = report.findings.find((item) => item.id === id);
            if (!finding || finding.severity !== "ok") {
              throw new Error(`expected ${id}=ok, got ${JSON.stringify(finding)}`);
            }
          }
          NODE
