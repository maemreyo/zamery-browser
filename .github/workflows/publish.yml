name: Publish npm packages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish with npm trusted publishing
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tooling
        run: npm install --global npm@11.21.0 pnpm@10.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate stable release versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          node --input-type=module - "$version" <<'NODE'
          import fs from "node:fs";

          const expected = process.argv[2];
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (root.version !== expected) {
            throw new Error(`package.json: release tag expects ${expected}, found ${root.version}`);
          }

          const publishable = [
            "packages/browser-provider/package.json",
            "packages/pi-browser/package.json",
            "packages/browser-firefox/package.json",
            "packages/browser-mcp/package.json",
          ];

          for (const file of publishable) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version.includes("-")) {
              throw new Error(`${file}: stable release cannot publish prerelease version ${pkg.version}`);
            }
          }
          NODE

      - name: Pack publishable tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zamery-pack"
          pnpm --filter @zamery/browser-provider pack --pack-destination "$RUNNER_TEMP/zamery-pack"
          pnpm --filter @zamery/pi-browser pack --pack-destination "$RUNNER_TEMP/zamery-pack"
          pnpm --filter @zamery/browser-firefox pack --pack-destination "$RUNNER_TEMP/zamery-pack"
          pnpm --filter @zamery/browser-mcp pack --pack-destination "$RUNNER_TEMP/zamery-pack"
          ls -lh "$RUNNER_TEMP/zamery-pack"

      - name: Publish tarballs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          publish_one() {
            local package_name="$1"
            local package_version="$2"
            local pattern="$3"
            local files=("$RUNNER_TEMP"/zamery-pack/$pattern)
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Expected exactly one tarball matching $pattern, found ${#files[@]}" >&2
              exit 1
            fi
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version already exists; skipping publish"
              return 0
            fi
            npm publish "${files[0]}" --access public
          }

          publish_one '@zamery/browser-provider' '0.2.3' 'zamery-browser-provider-*.tgz'
          publish_one '@zamery/pi-browser' '0.2.2' 'zamery-pi-browser-*.tgz'
          publish_one '@zamery/browser-firefox' '0.2.2' 'zamery-browser-firefox-*.tgz'
          publish_one '@zamery/browser-mcp' '0.1.2' 'zamery-browser-mcp-*.tgz'

      - name: Validate MCP Registry metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./packages/browser-mcp/package.json"); const s=require("./server.json"); const n=s.packages.find((x)=>x.registryType==="npm"&&x.identifier===p.name); if(p.mcpName!==s.name||p.version!==s.version||!n||n.version!==p.version){throw new Error("MCP Registry metadata does not match package")}'
          test "$(node -p 'require("./server.json").description.length')" -le 100

      - name: Install MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" |
            tar xz -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --help >/dev/null

      - name: Publish Official MCP Registry metadata
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" validate server.json
          server_name="$(node -p 'require("./server.json").name')"
          server_version="$(node -p 'require("./server.json").version')"
          encoded_name="$(node -p 'encodeURIComponent(require("./server.json").name)')"
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=$encoded_name" |
            jq -e --arg name "$server_name" --arg version "$server_version" '.servers[]? | select(.server.name == $name and .server.version == $version)' >/dev/null; then
            echo "$server_name@$server_version already exists in the Official MCP Registry; skipping publish"
            exit 0
          fi
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
